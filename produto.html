<!DOCTYPE html>
<html lang="pt-AO" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<script>
if('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js').catch(function(){}); }
(function(){var t=localStorage.getItem('tema')||'dark';document.documentElement.setAttribute('data-theme',t);})();
</script>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="theme-color" content="#0d0d1a"/>
<title>Produto</title>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/estilo.css"/>
<style>
.prod-hero{width:100%;aspect-ratio:1;max-height:360px;background:var(--bg2);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.prod-hero img{width:100%;height:100%;object-fit:cover}
.prod-emoji-big{font-size:9rem;animation:pulse 3s ease-in-out infinite;color:var(--muted)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.carousel{width:100%;aspect-ratio:1;max-height:360px;overflow:hidden;position:relative;background:var(--bg2)}
.carousel-track{display:flex;width:100%;height:100%;transition:transform .35s cubic-bezier(.4,0,.2,1);will-change:transform}
.carousel-slide{min-width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;background:var(--bg2)}
.carousel-slide img{width:100%;height:100%;object-fit:cover}
.carousel-dots{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:10}
.carousel-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.4);cursor:pointer;transition:all .2s}
.carousel-dot.on{background:#fff;width:18px;border-radius:3px}
.carousel-btn{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;background:rgba(13,13,26,.7);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10;backdrop-filter:blur(4px)}
.carousel-btn.prev{left:10px}.carousel-btn.next{right:10px}
.tag-strip{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:12px;pointer-events:none}
.tag-strip > *{pointer-events:all}
.prod-tag{padding:4px 12px;font-family:var(--ft);font-size:.56rem;border-radius:50px}
.prod-tag.promo{background:var(--red);color:#fff}
.prod-tag.novo{background:var(--teal);color:#0d0d1a}
.prod-tag.destaque{background:var(--grad);color:#fff}
.btn-zoom{padding:7px 14px;background:rgba(13,13,26,.85);border:1px solid rgba(255,255,255,.2);border-radius:50px;font-family:var(--ft);font-size:.6rem;color:#fff;cursor:pointer;backdrop-filter:blur(8px)}
.pd{padding:18px 16px 8px}
.pd-cat{font-size:.56rem;font-weight:700;text-transform:uppercase;color:var(--pink);opacity:.8;margin-bottom:3px}
.pd-nome{font-family:var(--ft);font-size:1.8rem;color:var(--white);line-height:1.1;margin-bottom:8px}
.pd-preco{font-family:var(--ft);font-size:1.3rem;color:var(--pink);margin-bottom:5px}
.pd-preco.orcamento{color:var(--coral)}
.pd-orig-row{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.pd-orig{font-size:.86rem;color:var(--muted2);text-decoration:line-through}
.pd-pct{padding:2px 8px;background:var(--red);color:#fff;font-family:var(--ft);font-size:.6rem;border-radius:6px}
.pd-desc{font-size:.86rem;color:var(--muted);line-height:1.65;font-style:italic;margin-bottom:10px}
.pd-dests{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.pd-dest-it{padding:4px 10px;background:rgba(6,214,160,.08);border:1px solid rgba(6,214,160,.2);border-radius:50px;font-size:.66rem;color:var(--teal)}
.divd{height:1px;background:var(--border);margin:14px 16px}
.sec{padding:0 16px;margin-bottom:16px}
.sec-t{font-size:.58rem;font-weight:700;text-transform:uppercase;color:var(--muted);letter-spacing:.5px;margin-bottom:10px}
.nota-input{width:100%;min-height:68px;padding:11px 13px;background:var(--bg2);border:1.5px solid var(--border);border-radius:12px;font-family:var(--fb);font-size:.83rem;color:var(--white);resize:none;outline:none;line-height:1.5;transition:border-color .2s}
.nota-input:focus{border-color:rgba(255,107,157,.4)}
.nota-input::placeholder{color:var(--muted2)}
.qty-row{display:flex;align-items:center}
.qty-btn{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--border);background:none;font-size:1.2rem;font-weight:700;color:var(--white);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--tr)}
.qty-btn:hover{background:var(--pink);border-color:var(--pink);color:#fff}
.qty-val{min-width:50px;text-align:center;font-family:var(--ft);font-size:1.1rem;color:var(--white)}
.specs-card{border:1px solid var(--border);border-radius:12px;overflow:hidden}
.spec-row{display:flex;gap:12px;padding:10px 14px;border-bottom:1px solid var(--border)}
.spec-row:last-child{border-bottom:none}
.spec-k{font-size:.6rem;font-weight:700;text-transform:uppercase;color:var(--muted);min-width:100px;flex-shrink:0;letter-spacing:.3px;padding-top:2px}
.spec-v{font-size:.82rem;color:var(--white);line-height:1.4}
.related-scroll{overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 6px}
.related-scroll::-webkit-scrollbar{display:none}
.related-inner{display:flex;gap:10px;width:max-content}
.rcard{width:112px;background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:var(--tr);flex-shrink:0;text-decoration:none;color:inherit;display:block}
.rcard:hover{border-color:rgba(255,107,157,.35);transform:translateY(-2px)}
.rcard-img{width:100%;height:90px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:2rem;overflow:hidden}
.rcard-img img{width:100%;height:100%;object-fit:cover}
.rcard-body{padding:7px 9px 10px}
.rcard-nome{font-family:var(--ft);font-size:.76rem;color:var(--white);line-height:1.2;margin-bottom:3px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rcard-preco{font-family:var(--ft);font-size:.74rem;color:var(--pink)}
.lightbox{position:fixed;inset:0;z-index:600;background:rgba(0,0,0,.97);display:none;align-items:center;justify-content:center;padding:20px}
.lightbox.on{display:flex}
.lb-img{max-width:100%;max-height:90vh;object-fit:contain;border-radius:14px}
.lb-close{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.12);border:none;color:#fff;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.body-prod{padding-bottom:66px}
</style>
</head>
<body class="body-prod">
<header class="hdr">
  <button class="btn-bk" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i></button>
  <div class="hdr-nome" id="hdr-titulo">Produto</div>
  <button class="hb btn-wl" id="btn-wl" onclick="doWishlist()" title="Wishlist"><i class="fa-regular fa-heart"></i></button>
  <button class="hb" onclick="partilharProduto({nome: _p?.nome||'', descricao: _p?.descricao||'', url: window.location.href, imagem: _p?.imagem||''})" title="Partilhar"><i class="fa-solid fa-share-nodes"></i></button>
</header>

<div id="hero-container"></div>

<div class="pd anim">
  <div class="pd-cat" id="pd-cat"></div>
  <div class="pd-nome" id="pd-nome">—</div>
  <div class="pd-preco" id="pd-preco"></div>
  <div class="pd-orig-row" id="pd-orig-row" style="display:none"><span class="pd-orig" id="pd-orig"></span><span class="pd-pct" id="pd-pct"></span></div>
  <p class="pd-desc" id="pd-desc"></p>
  <div class="pd-dests" id="pd-dests"></div>
</div>

<div class="divd"></div>
<div class="sec" id="sec-qty">
  <div class="sec-t"><i class="fa-solid fa-calculator"></i> Quantidade</div>
  <div class="qty-row"><button class="qty-btn" onclick="qty(-1)"><i class="fa-solid fa-minus"></i></button><span class="qty-val" id="qty-val">1</span><button class="qty-btn" onclick="qty(1)"><i class="fa-solid fa-plus"></i></button></div>
</div>

<div class="sec">
  <div class="sec-t"><i class="fa-solid fa-pen"></i> Personalização / Nota de encomenda</div>
  <textarea class="nota-input" id="nota-input" placeholder="Tema, cores, sabores, data do evento, observações..."></textarea>
</div>

<div class="divd"></div>
<div class="sec" id="sec-specs" style="display:none"><div class="sec-t"><i class="fa-solid fa-list"></i> Detalhes do produto</div><div class="specs-card" id="specs-card"></div></div>
<div class="divd" id="rel-div" style="display:none"></div>
<div class="sec" id="sec-rel" style="display:none"><div class="sec-t"><i class="fa-solid fa-arrow-right-arrow-left"></i> Veja também</div><div class="related-scroll"><div class="related-inner" id="rel-inner"></div></div></div>

<div class="lightbox" id="lightbox" onclick="fecharLightbox()"><button class="lb-close"><i class="fa-solid fa-xmark"></i></button><img class="lb-img" id="lb-img" src="" alt="" style="display:none"/></div>

<div class="nav">
  <a href="index.html" class="btn-home-nav" title="Início"><i class="fa-solid fa-house"></i></a>
  <button class="btn-add-nav" id="btn-add" onclick="addCart()" style="flex:1;height:40px;border:none;border-radius:50px;background:var(--grad);font-family:var(--ft);font-size:.76rem;color:#fff;cursor:pointer;transition:var(--tr);box-shadow:0 4px 14px rgba(255,107,157,.3)">
    <i class="fa-solid fa-cart-shopping" style="margin-right:6px"></i> Adicionar ao Carrinho
  </button>
</div>
<div class="toast" id="toast"></div>

<script src="js/app.js"></script>
<script src="catalogo.js?v=7"></script>
<script>
var API = 'https://impersilvatech-api.3miliosilva.workers.dev';
var _p=null,_qty=1,_loja={},_cats=[],_carouselIdx=0, _carouselImgs=[];

document.addEventListener('DOMContentLoaded',async function(){
  initTheme(); syncThemeIcons();
  var id=parseInt(getParam('id'));
  if(!id){window.location.href='catalogo.html';return;}
  try{
    var resultados = await Promise.all([
      fetch(API+'/api/loja').then(function(r){return r.json();}).catch(function(){return {};}),
      fetch(API+'/api/produtos/'+id).then(function(r){return r.json();}),
      fetch(API+'/api/categorias').then(function(r){return r.json();}).catch(function(){return [];})
    ]);
    _loja = resultados[0] || {};
    _cats = Array.isArray(resultados[2]) ? resultados[2] : [];
    var pR = resultados[1];
    if(!pR||pR.erro){window.location.href='catalogo.html';return;}

    var feats=[]; try{if(pR.features)feats=JSON.parse(pR.features);}catch(e){}
    var specs=[]; try{if(pR.specs)specs=JSON.parse(pR.specs);}catch(e){}
    var galeria=[]; try{if(pR.imagens_extra)galeria=JSON.parse(pR.imagens_extra);}catch(e){}
    var pct=(pR.preco_original&&pR.preco_original>pR.preco_base)?Math.round((1-pR.preco_base/pR.preco_original)*100):0;
    _p={
      id:pR.id, nome:pR.nome, descricao:pR.descricao||'',
      categoria:pR.categoria_id, preco:pR.preco_base||0,
      preco_orig:pR.preco_original||0,
      imagem:pR.imagem_url||'', galeria:galeria,
      disponivel:pR.disponivel!==0,
      etiqueta:pct>0?'promo':pR.destaque?'destaque':'',
      destaques:feats, specs:specs,
      stock:pR.stock!==undefined?pR.stock:-1,
      variacoes:(pR.variacoes||[]).map(function(v){return{id:v.id,nome:v.nome,preco_extra:v.preco_extra||0,disponivel:v.disponivel!==0};})
    };
    if(_loja.cor_primaria)document.documentElement.style.setProperty('--pink',_loja.cor_primaria);
    if(_loja.cor_secundaria)document.documentElement.style.setProperty('--purple',_loja.cor_secundaria);
  }catch(e){
    console.error('Erro ao carregar produto:',e);
    window.location.href='catalogo.html';return;
  }
  carregar();atualizarBadgeCarrinho();actuWishlist();
});

function carregar(){
  var p=_p;
  var l=_loja;
  document.title=p.nome+' | '+(l.nome||'');
  document.getElementById('hdr-titulo').textContent=p.nome;
  document.getElementById('pd-cat').textContent=_cats.find(function(c){return c.id===p.categoria;})?.nome||'';
  document.getElementById('pd-nome').textContent=p.nome;

  _carouselImgs=[];
  if(p.imagem) _carouselImgs.push(p.imagem);
  if(p.galeria&&p.galeria.length) _carouselImgs=_carouselImgs.concat(p.galeria.filter(function(x){return !!x;}));

  var heroContainer=document.getElementById('hero-container');
  var tagMap={promo:'<i class="fa-solid fa-tag"></i> Promoção',novo:'<i class="fa-solid fa-sparkles"></i> Novo',destaque:'<i class="fa-solid fa-star"></i> Destaque'};
  var tagHtml=p.etiqueta?'<span class="prod-tag '+p.etiqueta+'">'+(tagMap[p.etiqueta]||'')+'</span>':'<span></span>';

  if(_carouselImgs.length>1){
    var slides=_carouselImgs.map(function(img,i){
      return '<div class="carousel-slide"><img src="'+img+'" alt="'+p.nome+' '+(i+1)+'" loading="'+(i===0?'eager':'lazy')+'" style="width:100%;height:100%;object-fit:cover" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'"/><span style="display:none;font-size:6rem;width:100%;height:100%;align-items:center;justify-content:center;color:var(--muted)"><i class="fa-solid fa-image"></i></span></div>';
    }).join('');
    var dots=_carouselImgs.map(function(_,i){return '<div class="carousel-dot'+(i===0?' on':'')+'" onclick="goSlide('+i+')"></div>';}).join('');
    heroContainer.innerHTML=
      '<div class="carousel" id="carousel">'+
        '<div class="carousel-track" id="carousel-track">'+slides+'</div>'+
        '<button class="carousel-btn prev" onclick="goSlide(_carouselIdx-1)"><i class="fa-solid fa-chevron-left"></i></button>'+
        '<button class="carousel-btn next" onclick="goSlide(_carouselIdx+1)"><i class="fa-solid fa-chevron-right"></i></button>'+
        '<div class="carousel-dots">'+dots+'</div>'+
        '<div class="tag-strip">'+tagHtml+'<button class="btn-zoom" onclick="abrirLightbox()"><i class="fa-solid fa-magnifying-glass"></i> Ampliar</button></div>'+
      '</div>';
  } else if(_carouselImgs.length===1){
    heroContainer.innerHTML=
      '<div class="prod-hero" id="prod-hero">'+
        '<img src="'+_carouselImgs[0]+'" alt="'+p.nome+'" onerror="this.style.display=\'none\';document.getElementById(\'prod-emoji-fb\').style.display=\'flex\'"/>'+
        '<span class="prod-emoji-big" id="prod-emoji-fb" style="display:none"><i class="fa-solid fa-image"></i></span>'+
        '<div class="tag-strip">'+tagHtml+'<button class="btn-zoom" onclick="abrirLightbox()"><i class="fa-solid fa-magnifying-glass"></i> Ampliar</button></div>'+
      '</div>';
  } else {
    heroContainer.innerHTML=
      '<div class="prod-hero" id="prod-hero">'+
        '<span class="prod-emoji-big"><i class="fa-solid fa-image"></i></span>'+
        '<div class="tag-strip">'+tagHtml+'<button class="btn-zoom" onclick="abrirLightbox()"><i class="fa-solid fa-magnifying-glass"></i> Ampliar</button></div>'+
      '</div>';
  }

  var pEl=document.getElementById('pd-preco');
  if(p.preco>0){pEl.textContent=kz(p.preco, l.simbolo_moeda);pEl.className='pd-preco';}
  else{pEl.textContent='Orçamento personalizado';pEl.className='pd-preco orcamento';}
  if(p.preco_orig>0){document.getElementById('pd-orig').textContent=kz(p.preco_orig, l.simbolo_moeda);document.getElementById('pd-pct').textContent='-' + Math.round((1-p.preco/p.preco_orig)*100) + '%';document.getElementById('pd-orig-row').style.display='flex';}
  document.getElementById('pd-desc').textContent=p.descricao||'';
  document.getElementById('pd-dests').innerHTML=(p.destaques||[]).map(function(d){return '<span class="pd-dest-it"><i class="fa-solid fa-check"></i> '+d+'</span>';}).join('');
  if(p.preco===0){document.getElementById('sec-qty').style.display='none';}
  if(p.specs&&Object.keys(p.specs).length){document.getElementById('sec-specs').style.display='block';document.getElementById('specs-card').innerHTML=Object.entries(p.specs).map(function(e){return '<div class="spec-row"><span class="spec-k">'+e[0]+'</span><span class="spec-v">'+e[1]+'</span></div>';}).join('');}
  var prods=getProdutos();
  var rels=prods.filter(function(x){return x.categoria===p.categoria&&x.id!==p.id;}).slice(0,6);
  if(rels.length){document.getElementById('sec-rel').style.display='block';document.getElementById('rel-div').style.display='block';document.getElementById('rel-inner').innerHTML=rels.map(function(r){var imgH=r.imagem?'<img src="'+r.imagem+'" alt="" style="width:100%;height:100%;object-fit:cover" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'"><span style="display:none;font-size:2rem;width:100%;height:100%;align-items:center;justify-content:center;color:var(--muted)"><i class=\'fa-solid fa-image\'></i></span>':'<i class="fa-solid fa-image" style="font-size:2rem;color:var(--muted)"></i>';return'<a href="produto.html?id='+r.id+'" class="rcard"><div class="rcard-img">'+imgH+'</div><div class="rcard-body"><div class="rcard-nome">'+r.nome+'</div><div class="rcard-preco">'+kz(r.preco, l.simbolo_moeda)+'</div></div></a>';}).join('');}
  actuBtnAdd();
  if(_carouselImgs.length>1) _initSwipe();
}

function goSlide(idx){
  var total=_carouselImgs.length; if(!total)return;
  _carouselIdx=(idx+total)%total;
  var track=document.getElementById('carousel-track');
  if(track) track.style.transform='translateX(-'+(_carouselIdx*100)+'%)';
  document.querySelectorAll('.carousel-dot').forEach(function(d,i){d.classList.toggle('on',i===_carouselIdx);});
}

function _initSwipe(){
  var el=document.getElementById('carousel'); if(!el)return;
  var sx=0,sy=0,moving=false;
  el.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY;moving=false;},{passive:true});
  el.addEventListener('touchmove',function(e){var dx=Math.abs(e.touches[0].clientX-sx);var dy=Math.abs(e.touches[0].clientY-sy);if(dx>dy&&dx>8){moving=true;e.preventDefault();}},{passive:false});
  el.addEventListener('touchend',function(e){if(!moving)return;var dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>40) goSlide(_carouselIdx+(dx<0?1:-1));moving=false;},{passive:true});
}

function qty(d){_qty=Math.max(1,Math.min(99,_qty+d));document.getElementById('qty-val').textContent=_qty;actuBtnAdd();}
function actuBtnAdd(){if(_p&&_p.preco>0)document.getElementById('btn-add').innerHTML='<i class="fa-solid fa-cart-shopping" style="margin-right:6px"></i> Adicionar — '+kz(_p.preco*_qty, _loja.simbolo_moeda);}

function addCart(){
  if(!_p)return;
  var nota=document.getElementById('nota-input').value.trim();
  if(_p.preco===0){
    var l=_loja;var m='Pedido de Orçamento — '+(l.nome||'')+'\n\nProduto: '+_p.nome;
    if(nota)m+='\nDetalhes: '+nota;
    var waNum=(l.whatsapp||'').replace(/\D/g,'');
    if(waNum)window.open('https://wa.me/'+waNum+'?text='+encodeURIComponent(m),'_blank');
    return;
  }
  var c=getCarrinho();
  c.push({chave:String(_p.id)+'-'+Date.now(),produto_id:_p.id,nome:_p.nome,preco:_p.preco,quantidade:_qty,imagem:_p.imagem||'',nota:nota});
  salvarCarrinho(c);atualizarBadgeCarrinho();toast(_p.nome+' adicionado!','ok');
  var btnAdd=document.getElementById('btn-add');
  var txtOriginal=btnAdd.innerHTML;
  btnAdd.innerHTML='<i class="fa-solid fa-cart-shopping" style="margin-right:6px"></i> Ver Carrinho <i class="fa-solid fa-arrow-right"></i>';
  btnAdd.style.background='linear-gradient(135deg,#06d6a0,#04b385)';
  btnAdd.onclick=function(){window.location.href='carrinho.html';};
  clearTimeout(window._btnAddTimer);
  window._btnAddTimer=setTimeout(function(){
    btnAdd.innerHTML=txtOriginal;
    btnAdd.style.background='';
    btnAdd.onclick=addCart;
  },4000);
}

function abrirLightbox(){
  var lb=document.getElementById('lightbox'),lI=document.getElementById('lb-img');
  var imgActual=_carouselImgs[_carouselIdx]||_p.imagem;
  if(imgActual){lI.src=imgActual;lI.style.display='block';}
  lb.classList.add('on');document.body.style.overflow='hidden';
}
function fecharLightbox(){document.getElementById('lightbox').classList.remove('on');document.body.style.overflow='';}
function actuWishlist(){
  if(!_p) return;
  var btn=document.getElementById('btn-wl');
  if(btn){
    var wishlisted=isWishlisted(String(_p.id));
    btn.innerHTML=wishlisted?'<i class="fa-solid fa-heart" style="color:var(--pink)"></i>':'<i class="fa-regular fa-heart"></i>';
  }
}
function doWishlist(){
  if(!_p) return;
  var added=toggleWishlist(String(_p.id));
  actuWishlist();
  toast(added?'Adicionado à wishlist':'Removido da wishlist','ok');
}
</script>
</body>
</html>
