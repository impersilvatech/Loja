<!DOCTYPE html>
<html lang="pt-AO" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<script>
if('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js').catch(function(){}); }
(function(){
  var t=localStorage.getItem('tema')||'dark';
  document.documentElement.setAttribute('data-theme',t);
})();
</script>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="theme-color" content="#0d0d1a"/>
<meta name="description" content="A tua loja online de confiança em Angola"/>
<title>Loja</title>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/estilo.css"/>
<style>
.hero{margin:12px;border-radius:22px;background:var(--grad);padding:28px 20px 24px;position:relative;overflow:hidden;min-height:185px;display:flex;flex-direction:column;justify-content:flex-end}
.hero::before{content:'';position:absolute;top:-40px;right:-30px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero::after{content:'';position:absolute;top:30px;right:40px;width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero-float{position:absolute;top:14px;right:14px;font-size:4rem;animation:floatEmoji 4s ease-in-out infinite;opacity:.35}
@keyframes floatEmoji{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-10px) rotate(5deg)}}
.hero-tag{font-size:.58rem;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.8);margin-bottom:6px;display:block;position:relative;z-index:1}
.hero-h1{font-family:var(--ft);font-size:2rem;color:#fff;line-height:1.1;margin-bottom:10px;position:relative;z-index:1}
.hero-sub{font-size:.8rem;color:rgba(255,255,255,.8);margin-bottom:18px;line-height:1.5;position:relative;z-index:1}
.hero-btn{display:inline-flex;align-items:center;gap:7px;padding:11px 22px;background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.35);border-radius:50px;font-family:var(--ft);font-size:.78rem;color:#fff;text-decoration:none;backdrop-filter:blur(4px);transition:var(--tr);position:relative;z-index:1;width:fit-content}
.hero-btn:hover{background:rgba(255,255,255,.3)}
.auth-strip{margin:0 12px 12px;padding:13px 14px;border-radius:var(--r);border:1px solid var(--border);background:var(--card);display:none;align-items:center;gap:12px}
.as-ico i{font-size:1.5rem;color:var(--pink)}
.as-txt{flex:1}
.as-txt h4{font-family:var(--ft);font-size:.9rem;margin-bottom:1px}
.as-txt p{font-size:.72rem;color:var(--muted)}
.as-btn{padding:8px 16px;background:var(--grad);border:none;border-radius:50px;font-family:var(--ft);font-size:.72rem;color:#fff;cursor:pointer;white-space:nowrap;text-decoration:none}
.search-home{margin:0 12px 12px;position:relative}
.shi{width:100%;padding:12px 14px 12px 40px;background:var(--card);border:1px solid var(--border);border-radius:50px;font-family:var(--fb);font-size:.88rem;color:var(--white);outline:none;transition:border-color .2s}
.shi:focus{border-color:var(--pink)}
.shi::placeholder{color:var(--muted2)}
.shi-ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:.85rem;color:var(--muted)}
.sec-h{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 10px}
.sec-t{font-family:var(--ft);font-size:1rem;color:var(--white)}
.sec-a{font-size:.72rem;color:var(--pink);text-decoration:none;display:flex;align-items:center;gap:4px}
.cats-scroll{overflow-x:auto;scrollbar-width:none;padding:0 12px 12px}
.cats-scroll::-webkit-scrollbar{display:none}
.cats-row{display:flex;gap:9px;width:max-content}
.ccat{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 16px;text-align:center;cursor:pointer;transition:var(--tr);text-decoration:none;min-width:84px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.ccat:hover,.ccat:active{border-color:var(--pink);background:rgba(255,107,157,.06)}
.ccat-ico{font-size:1.5rem;line-height:1}
.ccat-lbl{font-family:var(--ft);font-size:.64rem;color:var(--white)}
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 12px}
@media(min-width:520px){.pgrid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:780px){.pgrid{grid-template-columns:repeat(4,1fr)}}
.pcard{background:var(--card);border:1px solid var(--border);border-radius:18px;overflow:hidden;cursor:pointer;transition:all .25s;position:relative;text-decoration:none;color:inherit;display:block}
.pcard:hover{transform:translateY(-3px);box-shadow:0 8px 28px rgba(255,107,157,.15);border-color:rgba(255,107,157,.35)}
.pcard.esgotado{opacity:.5;filter:grayscale(.4);cursor:not-allowed}
.pcard-img{aspect-ratio:1;background:var(--bg2);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:3rem}
.pcard-img img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.pcard:hover .pcard-img img{transform:scale(1.07)}
.ptag{position:absolute;top:7px;left:7px;padding:2px 8px;font-family:var(--ft);font-size:.5rem;border-radius:6px}
.ptag-promo{background:var(--red);color:#fff}
.ptag-novo{background:var(--teal);color:#0d0d1a}
.ptag-destaque{background:var(--grad);color:#fff}
.pcard-body{padding:8px 10px 12px}
.pcard-cat{font-size:.5rem;font-weight:700;color:var(--pink);opacity:.8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.pcard-nome{font-family:var(--ft);font-size:.88rem;line-height:1.25;margin-bottom:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pcard-preco{font-family:var(--ft);font-size:.9rem;color:var(--pink)}
.pcard-preco-orig{font-size:.68rem;color:var(--muted2);text-decoration:line-through;margin-left:4px}
.btn-add-q{position:absolute;bottom:8px;right:8px;width:28px;height:28px;border-radius:50%;background:var(--grad);border:none;color:#fff;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(255,107,157,.4);transition:var(--tr);z-index:2}
.btn-add-q:hover{transform:scale(1.12)}
.banner-entrega{margin:0 12px 12px;border-radius:var(--r);background:rgba(6,214,160,.06);border:1px solid rgba(6,214,160,.2);padding:14px;display:none;align-items:center;gap:12px}
.be-ico i{font-size:1.5rem;color:var(--teal);flex-shrink:0}
.be-txt{flex:1}
.be-txt h4{font-family:var(--ft);font-size:.88rem;color:var(--teal);margin-bottom:2px}
.be-txt p{font-size:.74rem;color:var(--muted);line-height:1.4}
.ptr{display:flex;justify-content:center;align-items:center;overflow:hidden;height:0;transition:height .2s;background:var(--bg)}
.ptr.show{height:52px}
.ptr-spin{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--pink);border-radius:50%;animation:spin-anim .8s linear infinite}
@keyframes spin-anim{to{transform:rotate(360deg)}}
.empty-msg{text-align:center;padding:30px;color:var(--muted);font-size:.85rem}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-logo" id="hdrLogo">Loja</div>
  <div class="hdr-acts">
    <button class="hb" onclick="toggleTheme()"><i data-theme-ico class="fa-solid fa-sun"></i></button>
    <a href="conta.html" class="hb" title="Conta"><i class="fa-solid fa-user"></i></a>
  </div>
</header>

<div class="ptr" id="ptr"><div class="ptr-spin"></div></div>

<div class="hero" id="hero">
  <div class="hero-float"><i class="fa-solid fa-star"></i></div>
  <span class="hero-tag">Bem-vindo</span>
  <h1 class="hero-h1" id="heroH1">Descobre o melhor<br>para ti</h1>
  <p class="hero-sub" id="heroSub">Qualidade em cada detalhe.</p>
  <a href="catalogo.html" class="hero-btn"><i class="fa-solid fa-store"></i> Ver Catálogo</a>
</div>

<div class="auth-strip" id="authStrip">
  <span class="as-ico"><i class="fa-solid fa-user-plus"></i></span>
  <div class="as-txt"><h4>Cria a tua conta</h4><p>Acompanha as tuas encomendas em tempo real</p></div>
  <a href="conta.html" class="as-btn">Entrar</a>
</div>

<div class="search-home">
  <span class="shi-ico"><i class="fa-solid fa-magnifying-glass"></i></span>
  <input class="shi" type="search" id="shi" placeholder="Pesquisar produto..." onkeydown="if(event.key==='Enter'&&this.value.trim()){sessionStorage.setItem('cf_busca_ini',this.value.trim());window.location.href='catalogo.html';}"/>
</div>

<div class="sec-h">
  <span class="sec-t"><i class="fa-solid fa-tags"></i> Categorias</span>
  <a href="catalogo.html" class="sec-a">Ver tudo <i class="fa-solid fa-chevron-right"></i></a>
</div>
<div class="cats-scroll"><div class="cats-row" id="catsRow"><div class="spin"></div></div></div>

<div class="sec-h">
  <span class="sec-t"><i class="fa-solid fa-fire"></i> Em Destaque</span>
  <a href="catalogo.html" class="sec-a">Ver tudo <i class="fa-solid fa-chevron-right"></i></a>
</div>
<div class="pgrid" id="pgDest"><p class="empty-msg" style="grid-column:1/-1"><span class="spin"></span></p></div>

<div class="banner-entrega" id="bannerEntrega">
  <span class="be-ico"><i class="fa-solid fa-truck-fast"></i></span>
  <div class="be-txt"><h4>Entrega ao domicílio</h4><p id="beSub">Recebe as tuas encomendas em casa.</p></div>
</div>

<a href="#" class="fab-wa" id="fabWa" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp"></i></a>

<div class="nav">
  <a href="index.html" class="btn-home-nav" title="Início"><i class="fa-solid fa-house"></i></a>
  <div class="nav-links">
    <a href="catalogo.html" class="nl"><i class="fa-solid fa-store"></i><span>Catálogo</span></a>
    <a href="conta.html" class="nl"><i class="fa-solid fa-user"></i><span>Conta</span></a>
    <a href="sobre.html" class="nl"><i class="fa-solid fa-circle-info"></i><span>Sobre</span></a>
  </div>
  <button class="btn-cart-nav" id="btnCart" disabled onclick="location.href='carrinho.html'">
    <i class="fa-solid fa-cart-shopping"></i> Ver Carrinho
  </button>
</div>
<div class="toast" id="toast"></div>

<script src="js/app.js"></script>
<script src="catalogo.js?v=7"></script>
<script>
var _loja, _cats, _prods;

document.addEventListener('DOMContentLoaded', async function() {
  initTheme(); syncThemeIcons();
  
  await initCatalogo();
  _loja = getLoja(); _cats = getCategorias(); _prods = getProdutos();

  console.log('Loja:', _loja);
  console.log('Categorias:', _cats);
  console.log('Produtos:', _prods);

  document.getElementById('hdrLogo').textContent = _loja.nome || 'Loja';
  document.title = _loja.nome || 'Loja';
  
  if (_loja.nome) {
    document.getElementById('heroH1').innerHTML = 'Bem-vindo à<br><span style="font-style:italic">' + _loja.nome + '</span>';
  }

  if (_loja.whatsapp) {
    document.getElementById('fabWa').href = 'https://wa.me/' + _loja.whatsapp.replace(/\D/g,'') + '?text=Ol%C3%A1!';
  } else {
    document.getElementById('fabWa').style.display = 'none';
  }

  var cli = getCliente();
  if (!cli) {
    document.getElementById('authStrip').style.display = 'flex';
  }

  buildCats();
  renderDestaques();
  atualizarBtnCart();
  initPTR();
});

function buildCats() {
  var row = document.getElementById('catsRow');
  if (!_cats || !_cats.length) { row.innerHTML = ''; return; }
  row.innerHTML = '<a href="catalogo.html" class="ccat"><span class="ccat-ico"><i class="fa-solid fa-store"></i></span><span class="ccat-lbl">Tudo</span></a>' +
    _cats.map(function(c) {
      return '<a href="catalogo.html?cat=' + c.slug + '" class="ccat"><span class="ccat-ico"><i class="fa-solid fa-tag"></i></span><span class="ccat-lbl">' + (c.nome||c.label) + '</span></a>';
    }).join('');
}

function renderDestaques() {
  var g = document.getElementById('pgDest');
  var lista = _prods.slice(0, 8);
  if (!lista.length) { 
    g.innerHTML = '<p class="empty-msg" style="grid-column:1/-1">Sem produtos ainda. Adiciona pelo admin!</p>'; 
    return; 
  }
  g.innerHTML = lista.map(function(p) { return cardHtml(p); }).join('');
}

function cardHtml(p) {
  var cat = _cats.find(function(c) { return c.id === p.categoria; });
  var pct = p.preco_orig > 0 ? Math.round((1-p.preco/p.preco_orig)*100) : 0;
  var imgH = p.imagem ? '<img src="' + p.imagem + '" alt="' + p.nome + '" loading="lazy" onerror="this.parentElement.innerHTML=\\'<i class=fa-solid fa-image style=font-size:3rem></i>\\'">' : '<i class="fa-solid fa-image" style="font-size:3rem;color:var(--muted2)"></i>';
  
  return '<a href="produto.html?id=' + p.id + '" class="pcard">' +
    '<div class="pcard-img">' + imgH + '</div>' +
    (pct > 0 ? '<span class="ptag ptag-promo">-' + pct + '%</span>' : '') +
    '<div class="pcard-body">' +
      '<div class="pcard-cat">' + (cat ? (cat.label||cat.nome) : '') + '</div>' +
      '<div class="pcard-nome">' + p.nome + '</div>' +
      '<div style="display:flex;align-items:center;flex-wrap:wrap;gap:4px">' +
        '<span class="pcard-preco">' + (p.preco>0 ? kz(p.preco, _loja.simbolo_moeda) : 'Orçamento') + '</span>' +
        (p.preco_orig>0 ? '<span class="pcard-preco-orig">' + kz(p.preco_orig, _loja.simbolo_moeda) + '</span>' : '') +
      '</div>' +
    '</div>' +
    '<button class="btn-add-q" onclick="event.preventDefault();addCart(event,' + p.id + ')"><i class="fa-solid fa-plus"></i></button>' +
  '</a>';
}

function addCart(e, id) {
  e.stopPropagation();
  var p = _prods.find(function(x) { return x.id === id; }); if (!p) return;
  var c = getCarrinho();
  c.push({chave:'' + p.id + '-' + Date.now(),produto_id:p.id,nome:p.nome,preco:p.preco,quantidade:1,imagem:p.imagem||'',nota:''});
  salvarCarrinho(c); atualizarBadgeCarrinho(); atualizarBtnCart();
  toast(p.nome + ' adicionado', 'ok');
}

function atualizarBtnCart() {
  var q = qtdCarrinho();
  var btn = document.getElementById('btnCart');
  if (q > 0) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-cart-shopping"></i> Ver Carrinho <span class="cart-ct">' + q + '</span>'; }
  else { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-cart-shopping"></i> Ver Carrinho'; }
}

function initPTR() {
  var sy = 0, act = false;
  document.addEventListener('touchstart', function(e) { if (window.scrollY === 0) sy = e.touches[0].clientY; }, { passive: true });
  document.addEventListener('touchmove', function(e) {
    if (window.scrollY > 0 || act) return;
    if (e.touches[0].clientY - sy > 55) { act = true; document.getElementById('ptr').classList.add('show'); }
  }, { passive: true });
  document.addEventListener('touchend', async function() {
    if (!act) return; act = false;
    await refreshCatalogo();
    _loja = getLoja(); _cats = getCategorias(); _prods = getProdutos();
    buildCats(); renderDestaques(); atualizarBtnCart();
    document.getElementById('ptr').classList.remove('show');
  }, { passive: true });
}
</script>
</body>
</html>
