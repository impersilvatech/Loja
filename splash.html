<!DOCTYPE html>
<html lang="pt-AO" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="theme-color" content="#0d0d1a"/>
<title>IMPERSILVATECH</title>
<style>
:root{--bg:#0d0d1a;--pink:#ff6b9d;--purple:#b14ae8;--teal:#06d6a0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;animation:fadeIn .6s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes pulse{0%,100%{opacity:0.4}50%{opacity:1}}

.splash-icon{width:100px;height:100px;margin-bottom:24px;animation:float 3s ease-in-out infinite}
.splash-icon img,.splash-icon svg{width:100%;height:100%}

.splash-title{font-family:'Fredoka One',cursive;font-size:1.8rem;background:linear-gradient(135deg,var(--pink),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}

.splash-sub{font-size:.95rem;color:#9898bb;margin-bottom:6px;font-style:italic}

.splash-footer{font-size:.7rem;color:#4a4a6a;margin-top:40px;letter-spacing:1px;text-transform:uppercase}

.splash-dots{display:flex;gap:6px;margin-top:24px}
.splash-dot{width:6px;height:6px;border-radius:50%;background:var(--pink);animation:pulse 1.5s ease-in-out infinite}
.splash-dot:nth-child(2){animation-delay:.2s;background:var(--purple)}
.splash-dot:nth-child(3){animation-delay:.4s;background:var(--teal)}
</style>
</head>
<body>

<div class="splash-icon">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
      <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#ff6b9d"/>
        <stop offset="50%" style="stop-color:#b14ae8"/>
        <stop offset="100%" style="stop-color:#06d6a0"/>
      </linearGradient>
      <linearGradient id="base" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#f8e1a0"/>
        <stop offset="100%" style="stop-color:#e8c860"/>
      </linearGradient>
      <linearGradient id="top" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#fff5f8"/>
        <stop offset="100%" style="stop-color:#ffd6e8"/>
      </linearGradient>
    </defs>
    <rect x="0" y="0" width="100" height="100" rx="20" fill="url(#bg)"/>
    <path d="M22 70 L18 95 L82 95 L78 70 Z" fill="url(#base)" stroke="#d4a830" stroke-width="1.5"/>
    <line x1="25" y1="75" x2="22" y2="93" stroke="#d4a830" stroke-width="1" opacity="0.6"/>
    <line x1="33" y1="73" x2="31" y2="94" stroke="#d4a830" stroke-width="1" opacity="0.6"/>
    <line x1="41" y1="72" x2="40" y2="94" stroke="#d4a830" stroke-width="1" opacity="0.6"/>
    <line x1="50" y1="71" x2="50" y2="95" stroke="#d4a830" stroke-width="1" opacity="0.6"/>
    <line x1="59" y1="72" x2="60" y2="94" stroke="#d4a830" stroke-width="1" opacity="0.6"/>
    <line x1="67" y1="73" x2="69" y2="94" stroke="#d4a830" stroke-width="1" opacity="0.6"/>
    <line x1="75" y1="75" x2="78" y2="93" stroke="#d4a830" stroke-width="1" opacity="0.6"/>
    <path d="M12 72 Q12 42 28 48 Q30 28 50 30 Q70 28 72 48 Q88 42 88 72 Z" fill="url(#top)"/>
    <path d="M18 70 Q16 55 24 52 Q28 45 36 50 Q40 38 50 40 Q60 38 64 50 Q72 45 76 52 Q84 55 82 70" fill="none" stroke="#ff6b9d" stroke-width="3" opacity="0.8"/>
    <rect x="28" y="38" width="5" height="2" rx="1" fill="#ffd166" transform="rotate(30 30 39)"/>
    <rect x="40" y="34" width="5" height="2" rx="1" fill="#06d6a0" transform="rotate(-20 42 35)"/>
    <rect x="52" y="36" width="5" height="2" rx="1" fill="#ff4757" transform="rotate(45 54 37)"/>
    <rect x="60" y="42" width="5" height="2" rx="1" fill="#ffd166" transform="rotate(-35 62 43)"/>
    <rect x="35" y="46" width="5" height="2" rx="1" fill="#ff9f43" transform="rotate(15 37 47)"/>
    <rect x="48" y="44" width="5" height="2" rx="1" fill="#4ecdc4" transform="rotate(-40 50 45)"/>
    <rect x="56" y="38" width="5" height="2" rx="1" fill="#a29bfe" transform="rotate(25 58 39)"/>
    <circle cx="50" cy="22" r="9" fill="#ff4757"/>
    <circle cx="47" cy="18" r="3" fill="#fff" opacity="0.7"/>
    <path d="M50 13 Q55 8 60 12" fill="none" stroke="#2d5a27" stroke-width="1.5" stroke-linecap="round"/>
    <ellipse cx="62" cy="10" rx="6" ry="3" fill="#2d5a27" transform="rotate(-20 62 10)"/>
    <ellipse cx="30" cy="25" rx="8" ry="4" fill="#fff" opacity="0.15" transform="rotate(-30 30 25)"/>
  </svg>
</div>

<div class="splash-title" id="splashNome">IMPERSILVATECH</div>
<div class="splash-sub">Startup Tecnológica</div>

<div class="splash-dots">
  <div class="splash-dot"></div>
  <div class="splash-dot"></div>
  <div class="splash-dot"></div>
</div>

<div class="splash-footer">Feito com ❤️ em Angola</div>

<script>
// Redireciona para a página inicial após 2 segundos
setTimeout(function(){
  window.location.href='/Loja/index.html';
},2000);

// Vai buscar o nome da loja
try{
  fetch('https://impersilva-d1work.3miliosilva.workers.dev/api/loja')
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.nome)document.getElementById('splashNome').textContent=d.nome;
    })
    .catch(function(){});
}catch(e){}
</script>
</body>
</html>
