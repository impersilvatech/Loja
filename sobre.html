<!DOCTYPE html>
<html lang="pt-AO" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<script>
if('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js').catch(function(){}); }
(function(){var t=localStorage.getItem('tema')||'dark';document.documentElement.setAttribute('data-theme',t);})();
</script>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="theme-color" content="#0d0d1a"/>
<meta name="description" content="Conhece mais sobre a nossa loja"/>
<title>Sobre Nós</title>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/estilo.css"/>
<style>
.hero{background:var(--grad);border-radius:20px;padding:24px 18px;text-align:center;margin-bottom:12px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-30px;right:-20px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero-logo{width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 12px;border:2px solid rgba(255,255,255,.3);overflow:hidden}
.hero-logo img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.hero h1{font-family:var(--ft);font-size:1.6rem;color:#fff;margin-bottom:4px}
.hero p{font-size:.8rem;color:rgba(255,255,255,.8);line-height:1.5}
.card p{font-size:.86rem;color:var(--muted);line-height:1.7;margin-bottom:8px}
.card p:last-child{margin-bottom:0}
.ct{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:.84rem}
.ct:last-child{border-bottom:none}
.ct i{width:20px;color:var(--pink);font-size:.9rem;flex-shrink:0}
.ct a{color:var(--pink);text-decoration:none}
.ct span{color:var(--muted)}
.redes{display:flex;gap:9px;margin-top:12px;flex-wrap:wrap}
.rede{width:42px;height:42px;border-radius:50%;background:var(--bg2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--white);font-size:1.1rem;text-decoration:none;transition:var(--tr)}
.rede:hover{background:var(--pink);border-color:var(--pink);color:#fff}
.hr-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.hr-item{display:flex;justify-content:space-between;padding:8px 10px;background:var(--bg2);border-radius:9px;font-size:.76rem}
.hr-item span:first-child{color:var(--muted);font-weight:600}
.ent-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;background:rgba(6,214,160,.08);border:1px solid rgba(6,214,160,.2);border-radius:50px;font-size:.7rem;color:var(--teal);margin-bottom:10px}
</style>
</head>
<body>
<header class="hdr">
  <button class="btn-bk" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i></button>
  <div class="hdr-nome" id="hdrNome">Sobre Nós</div>
  <button class="hb" onclick="toggleTheme()"><i data-theme-ico class="fa-solid fa-sun"></i></button>
</header>

<div class="ctn" id="ctn"><div class="spin"></div></div>

<div class="nav">
  <a href="index.html" class="btn-home-nav" title="Início"><i class="fa-solid fa-house"></i></a>
  <button class="btn-cat-nav" onclick="location.href='catalogo.html'"><i class="fa-solid fa-store"></i> Ver Catálogo</button>
</div>

<div class="toast" id="toast"></div>

<script src="js/app.js"></script>
<script src="catalogo.js?v=7"></script>
<script>
document.addEventListener('DOMContentLoaded', async function() {
  initTheme(); syncThemeIcons();
  await initCatalogo();
  var l = getLoja();

  // Meta tags Open Graph
  definirMetaTags({
    titulo: (l.nome || 'Sobre Nós') + ' — Loja Online',
    descricao: l.descricao || l.slogan || 'Conhece mais sobre a nossa loja em Angola.',
    imagem: l.logo || 'favicon.svg',
    url: window.location.href
  });

  document.getElementById('hdrNome').textContent = l.nome || 'Sobre Nós';
  document.title = 'Sobre | ' + (l.nome || '');
  renderSobre(l);
});

function renderSobre(l) {
  var waNum = (l.whatsapp||'').replace(/\D/g,'');
  var dias = [
    {k:'seg',label:'Segunda'},{k:'ter',label:'Terça'},{k:'qua',label:'Quarta'},
    {k:'qui',label:'Quinta'},{k:'sex',label:'Sexta'},{k:'sab',label:'Sábado'},{k:'dom',label:'Domingo'}
  ];
  var horariosHtml = dias.filter(function(d){return l.horarios?.[d.k];}).map(function(d){return '<div class="hr-item"><span>'+d.label+'</span><span>'+l.horarios[d.k]+'</span></div>';}).join('');
  var redes = [
    {href:l.instagram,ico:'fa-brands fa-instagram'},
    {href:l.facebook,ico:'fa-brands fa-facebook'},
    {href:l.tiktok,ico:'fa-brands fa-tiktok'},
    {href:l.youtube,ico:'fa-brands fa-youtube'}
  ].filter(function(r){return r.href;});
  var redesHtml = redes.map(function(r){return '<a href="'+r.href+'" class="rede" target="_blank" rel="noopener"><i class="'+r.ico+'"></i></a>';}).join('');

  document.getElementById('ctn').innerHTML =
    '<div class="hero">'+
      '<div class="hero-logo">'+(l.logo?'<img src="'+l.logo+'" alt="'+l.nome+'">':'<i class="fa-solid fa-shop" style="color:#fff;font-size:1.8rem"></i>')+'</div>'+
      '<h1>'+(l.nome||'A Nossa Loja')+'</h1>'+
      (l.slogan?'<p>'+l.slogan+'</p>':'')+
    '</div>'+
    (l.descricao||l.sobre?'<div class="card"><div class="card-h"><i class="fa-solid fa-circle-info"></i> Quem Somos</div>'+(l.descricao?'<p>'+l.descricao+'</p>':'')+(l.sobre?'<p>'+l.sobre+'</p>':'')+'</div>':'')+
    '<div class="card">'+
      '<div class="card-h"><i class="fa-solid fa-address-book"></i> Contacto</div>'+
      (l.telefone?'<div class="ct"><i class="fa-solid fa-phone"></i><span><a href="tel:'+l.telefone+'">'+l.telefone+'</a></span></div>':'')+
      (waNum?'<div class="ct"><i class="fa-brands fa-whatsapp"></i><span><a href="https://wa.me/'+waNum+'" target="_blank" rel="noopener">'+l.whatsapp+'</a></span></div>':'')+
      (l.email?'<div class="ct"><i class="fa-solid fa-envelope"></i><span><a href="mailto:'+l.email+'">'+l.email+'</a></span></div>':'')+
      (l.morada?'<div class="ct"><i class="fa-solid fa-location-dot"></i><span>'+l.morada+(l.cidade?', '+l.cidade:'')+(l.provincia?' — '+l.provincia:'')+'</span></div>':'')+
      (redesHtml?'<div class="redes">'+redesHtml+'</div>':'')+
      (waNum?'<a href="https://wa.me/'+waNum+'?text=Ol%C3%A1!%20Gostaria%20de%20mais%20informa%C3%A7%C3%B5es." class="btn-wa" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp" style="font-size:1.3rem"></i> Falar pelo WhatsApp</a>':'')+
    '</div>'+
    (horariosHtml?'<div class="card"><div class="card-h"><i class="fa-regular fa-clock"></i> Horários</div><div class="hr-grid">'+horariosHtml+'</div></div>':'')+
    (l.entrega_ativa?'<div class="card"><div class="card-h"><i class="fa-solid fa-truck-fast"></i> Entregas</div><div class="ent-badge"><i class="fa-solid fa-circle-check"></i> Entrega ao domicílio disponível</div><p>'+(l.entrega_preco>0?'Taxa: <strong>'+kz(l.entrega_preco,l.simbolo_moeda)+'</strong>':'Entrega gratuita')+(l.entrega_gratis>0?' &middot; Grátis a partir de '+kz(l.entrega_gratis,l.simbolo_moeda):'')+'</p>'+(l.entrega_prazo?'<p><i class="fa-regular fa-hourglass-half"></i> Prazo: '+l.entrega_prazo+'</p>':'')+(l.entrega_zonas?'<p><i class="fa-solid fa-map-pin"></i> Zonas: '+l.entrega_zonas+'</p>':'')+'</div>':'')+
    (l.politica||l.termos?'<div class="card"><div class="card-h"><i class="fa-solid fa-shield-halved"></i> Políticas</div>'+(l.politica?'<p>'+l.politica+'</p>':'')+(l.termos?'<p>'+l.termos+'</p>':'')+'</div>':'');
}
</script>
</body>
</html>
