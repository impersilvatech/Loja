<!DOCTYPE html>
<html lang="pt-AO" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="theme-color" content="#0d0d1a"/>
<title>A Minha Conta</title>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0d0d1a;--bg2:#14142b;--card:#1a1a32;--border:#2a2a4a;--pink:#ff6b9d;--purple:#b14ae8;--teal:#06d6a0;--yellow:#ffd166;--red:#ff4757;--white:#f0f0ff;--muted:#9898bb;--ft:'Fredoka One',cursive;--fb:'Nunito',sans-serif;--grad:linear-gradient(135deg,#ff6b9d,#b14ae8)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fb);background:var(--bg);color:var(--white);min-height:100vh;padding-bottom:80px}
.hdr{position:sticky;top:0;z-index:100;background:rgba(13,13,26,.97);backdrop-filter:blur(24px);border-bottom:1px solid var(--border);padding:10px 14px;display:flex;align-items:center;gap:10px}
.btn-bk{width:34px;height:34px;border-radius:50%;background:none;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.88rem;cursor:pointer;color:var(--white)}
.hdr-nome{font-family:var(--ft);font-size:1.1rem;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;flex:1;text-align:center}
.hb{width:34px;height:34px;border-radius:50%;background:none;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.88rem;cursor:pointer;color:var(--white)}
.ctn{padding:16px;max-width:480px;margin:0 auto}
.tabs{display:flex;background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:14px}
.tab{flex:1;padding:12px;background:none;border:none;font-family:var(--ft);font-size:.85rem;color:var(--muted);cursor:pointer;transition:all .2s}
.tab.on{background:var(--grad);color:#fff}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:12px}
.card.hidden{display:none}
.fg{margin-bottom:11px}
.fg label{display:block;font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:4px}
.fg label .opc{font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted)}
.fi{width:100%;padding:11px 13px;background:var(--bg2);border:1.5px solid var(--border);border-radius:10px;font-family:var(--fb);font-size:.88rem;color:var(--white);outline:none;transition:border-color .2s}
.fi:focus{border-color:var(--pink)}.fi::placeholder{color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-sub{width:100%;padding:14px;background:var(--grad);border:none;border-radius:50px;font-family:var(--ft);font-size:.95rem;color:#fff;cursor:pointer;box-shadow:0 4px 16px rgba(255,107,157,.3);display:flex;align-items:center;justify-content:center;gap:8px}
.btn-sub:disabled{opacity:.5}
.msg{font-size:.78rem;text-align:center;margin-top:10px;min-height:18px}
.msg.err{color:var(--red)}.msg.ok{color:var(--teal)}

/* Rastreio Card */
.rastreio-card{
  background:var(--grad);color:#fff;border:none;
  border-radius:18px;padding:20px;margin-bottom:14px;
}
.rastreio-card h3{
  font-family:var(--ft);font-size:1rem;margin-bottom:4px;
  display:flex;align-items:center;gap:8px;
}
.rastreio-card p{
  font-size:.76rem;opacity:.85;margin-bottom:12px;line-height:1.4;
}
.rastreio-card .fi{
  background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);
  color:#fff;margin-bottom:8px;
}
.rastreio-card .fi::placeholder{color:rgba(255,255,255,.5)}
.rastreio-card .btn-sub{
  background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);
  box-shadow:none;
}

/* Perfil */
.perfil-card{background:var(--grad);border-radius:20px;padding:0;margin-bottom:14px;position:relative;overflow:hidden}
.perfil-top{position:relative;padding:40px 20px 30px;text-align:center;overflow:hidden}
.perfil-top::before{content:'';position:absolute;top:-60px;right:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08)}
.perfil-top::after{content:'';position:absolute;bottom:-30px;left:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.06)}
.perfil-icone{font-size:3.5rem;color:#fff;display:block;margin-bottom:12px;animation:floatIcon 3s ease-in-out infinite;position:relative;z-index:1;opacity:.9}
@keyframes floatIcon{0%,100%{transform:translateY(0) rotate(0deg)}25%{transform:translateY(-8px) rotate(-5deg)}75%{transform:translateY(-4px) rotate(5deg)}}
.perfil-nome{font-family:var(--ft);font-size:1.4rem;color:#fff;margin-bottom:4px;position:relative;z-index:1}
.perfil-email{font-size:.78rem;color:rgba(255,255,255,.7);position:relative;z-index:1}
.perfil-stats{display:flex;border-top:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.1)}
.perfil-stat{flex:1;text-align:center;padding:14px 8px;color:#fff;text-decoration:none;transition:all .2s}
.perfil-stat:hover{background:rgba(255,255,255,.08)}
.perfil-stat-num{font-family:var(--ft);font-size:1.3rem;display:block}
.perfil-stat-lbl{font-size:.58rem;opacity:.7;text-transform:uppercase;letter-spacing:.5px}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.perfil-anim{animation:fadeInUp .5s ease both}

.btn-sair{width:100%;padding:13px;background:none;border:1.5px solid var(--border);border-radius:50px;font-family:var(--ft);font-size:.88rem;color:var(--red);cursor:pointer;transition:all .2s}
.btn-sair:hover{background:rgba(255,71,87,.08);border-color:var(--red)}
.menu{background:var(--card);border:1px solid var(--border);border-radius:18px;overflow:hidden;margin-bottom:12px}
.mi{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:all .2s;text-decoration:none;color:inherit}
.mi:last-child{border-bottom:none}
.mi:hover{background:rgba(255,107,157,.05)}
.mi-ico{width:36px;height:36px;border-radius:10px;background:rgba(255,107,157,.1);display:flex;align-items:center;justify-content:center;font-size:.88rem;color:var(--pink);flex-shrink:0}
.mi-txt{flex:1}
.mi-txt strong{display:block;font-size:.88rem;margin-bottom:1px}
.mi-txt span{font-size:.7rem;color:var(--muted)}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:200;padding:6px 10px 8px;display:flex;gap:8px;align-items:center;background:rgba(13,13,26,.97);border-top:1px solid var(--border)}
.btn-home-nav{width:38px;height:38px;background:var(--bg2);border:1px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--white);text-decoration:none}
.btn-cat-nav{flex:1;height:38px;border:none;background:var(--grad);border-radius:50px;font-family:var(--ft);font-size:.76rem;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--card);border:1px solid var(--pink);border-radius:14px;padding:10px 18px;font-size:.82rem;font-weight:700;color:var(--pink);z-index:9999;opacity:0;pointer-events:none;transition:transform .4s ease}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.err{border-color:var(--red);color:var(--red)}
.spin{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--pink);border-radius:50%;animation:spin-anim .8s linear infinite;margin:28px auto}
@keyframes spin-anim{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header class="hdr">
  <button class="btn-bk" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i></button>
  <div class="hdr-nome">A Minha Conta</div>
  <div style="width:34px"></div>
</header>

<div class="ctn">
  <!-- RASTREIO RÁPIDO (sempre visível) -->
  <div class="rastreio-card">
    <h3><i class="fa-solid fa-magnifying-glass"></i> Rastrear Encomenda</h3>
    <p>Acompanhe o estado do seu pedido em tempo real. Insira a referência abaixo.</p>
    <input class="fi" type="text" id="rastrearRef" placeholder="ENC-XXXXXXXXXXXXXXX" style="text-transform:uppercase" onkeydown="if(event.key==='Enter')irRastrear()"/>
    <button class="btn-sub" onclick="irRastrear()"><i class="fa-solid fa-magnifying-glass"></i> Ver Estado da Encomenda</button>
    <div id="rastrearResult" style="margin-top:8px;font-size:.78rem"></div>
  </div>

  <div id="authBox">
    <div class="tabs">
      <button class="tab on" id="tabL" onclick="mudarTab('login')">Entrar</button>
      <button class="tab" id="tabR" onclick="mudarTab('registar')">Criar Conta</button>
    </div>
    <div class="card" id="fLogin">
      <div class="fg"><label>Email ou Telefone</label><input class="fi" type="text" id="lContact" placeholder="email@... ou +244..."></div>
      <div class="fg"><label>Password</label><input class="fi" type="password" id="lPass" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()"></div>
      <button class="btn-sub" onclick="login()"><i class="fa-solid fa-arrow-right-to-bracket"></i> Entrar</button>
      <p class="msg" id="lMsg"></p>
    </div>
    <div class="card hidden" id="fReg">
      <div class="fg"><label>Nome completo *</label><input class="fi" type="text" id="rNome" placeholder="O seu nome"></div>
      <div class="fg"><label>Email <span class="opc">(opcional)</span></label><input class="fi" type="email" id="rEmail" placeholder="email@..."></div>
      <div class="fg"><label>Telefone (+244) *</label><input class="fi" type="tel" id="rTel" placeholder="+244 9XX XXX XXX" oninput="formatarTel(this)"></div>
      <div class="fg"><label>Password *</label><input class="fi" type="password" id="rPass" placeholder="Mínimo 6 caracteres"></div>
      <button class="btn-sub" onclick="registar()"><i class="fa-solid fa-user-plus"></i> Criar Conta</button>
      <p class="msg" id="rMsg"></p>
    </div>
  </div>

  <div id="perfilBox" style="display:none">
    <div class="perfil-card perfil-anim" id="perfilCard"></div>
    <div class="menu">
      <a href="rastrear.html" class="mi"><div class="mi-ico"><i class="fa-solid fa-magnifying-glass"></i></div><div class="mi-txt"><strong>Rastrear Encomenda</strong><span>Acompanhe o seu pedido</span></div></a>
      <a href="catalogo.html" class="mi"><div class="mi-ico"><i class="fa-solid fa-store"></i></div><div class="mi-txt"><strong>Ver Catálogo</strong><span>Explorar produtos</span></div></a>
      <a href="carrinho.html" class="mi"><div class="mi-ico"><i class="fa-solid fa-cart-shopping"></i></div><div class="mi-txt"><strong>Meu Carrinho</strong><span>Itens no carrinho</span></div></a>
      <a href="sobre.html" class="mi"><div class="mi-ico"><i class="fa-solid fa-circle-info"></i></div><div class="mi-txt"><strong>Sobre a Loja</strong><span>Contactos e informações</span></div></a>
    </div>
    <div style="font-family:var(--ft);font-size:.95rem;color:var(--pink);margin-bottom:10px;display:flex;align-items:center;gap:6px"><i class="fa-solid fa-clock-rotate-left"></i> As Minhas Encomendas</div>
    <div id="encLista" style="margin-bottom:14px"><p style="font-size:.82rem;color:var(--muted);text-align:center;padding:20px">A carregar...</p></div>
    <button class="btn-sair" onclick="logout()"><i class="fa-solid fa-right-from-bracket" style="margin-right:6px"></i> Terminar Sessão</button>
  </div>
</div>

<div class="nav">
  <a href="index.html" class="btn-home-nav"><i class="fa-solid fa-house"></i></a>
  <button class="btn-cat-nav" onclick="location.href='catalogo.html'"><i class="fa-solid fa-store"></i> Ver Catálogo</button>
</div>
<div class="toast" id="toast"></div>

<script>
var API = 'https://impersilva-d1work.3miliosilva.workers.dev';

function getParam(n){ return new URLSearchParams(window.location.search).get(n); }
function toast(msg,t){ var el=document.getElementById('toast');el.textContent=msg;el.className='toast show '+(t||'ok');setTimeout(function(){el.classList.remove('show');},3000); }
function kz(v){ if(v==null)return'—';return'Kz '+Number(v).toLocaleString('pt'); }
function fmtData(d){ if(!d)return'';return new Date(d).toLocaleDateString('pt',{day:'2-digit',month:'short',year:'numeric'}); }
function formatarTel(inp){ var v=inp.value.replace(/[^0-9+]/g,'');if(v.startsWith('+244')){var r=v.slice(4);if(r.length>9)r=r.slice(0,9);inp.value='+244 '+r;}else if(v.startsWith('9')){var r=v.replace(/[^0-9]/g,'');if(r.length>9)r=r.slice(0,9);inp.value='+244 '+r;}else if(v.length>0){inp.value='+244 ';} }
function validarTel(t){ return /^(\+244)?\s?9\d{8}$/.test(t.replace(/\s+/g,'')); }
function validarEmail(e){ return !e || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }
function getCliente(){ try{return JSON.parse(localStorage.getItem('cf_cliente')||'null');}catch(e){return null;} }
function salvarTel(t){ if(t) localStorage.setItem('cf_cliente_tel', t); }

function irRastrear(){
  var ref = document.getElementById('rastrearRef').value.trim().toUpperCase();
  if(!ref){ toast('Insira uma referência','err'); return; }
  if(!/^ENC-\d{8,}$/.test(ref)){ toast('Formato inválido: ENC-XXXXXXXXXXXXXXX','err'); return; }
  window.location.href = 'rastrear.html?ref='+encodeURIComponent(ref);
}

var avatares = [
  'fa-solid fa-crown','fa-solid fa-star','fa-solid fa-heart','fa-solid fa-gem',
  'fa-solid fa-bolt','fa-solid fa-fire','fa-solid fa-sun','fa-solid fa-moon',
  'fa-solid fa-ghost','fa-solid fa-dragon','fa-solid fa-fish','fa-solid fa-cat',
  'fa-solid fa-dog','fa-solid fa-kiwi-bird','fa-solid fa-otter','fa-solid fa-hippo',
  'fa-solid fa-feather','fa-solid fa-leaf','fa-solid fa-seedling','fa-solid fa-tree'
];

function mudarTab(t){
  document.getElementById('tabL').classList.toggle('on',t==='login');
  document.getElementById('tabR').classList.toggle('on',t==='registar');
  document.getElementById('fLogin').classList.toggle('hidden',t!=='login');
  document.getElementById('fReg').classList.toggle('hidden',t!=='registar');
}

async function login(){
  var c=document.getElementById('lContact').value.trim(),p=document.getElementById('lPass').value;
  var msg=document.getElementById('lMsg');
  if(!c||!p){msg.textContent='Preenche todos os campos.';msg.className='msg err';return;}
  try{
    var body={password:p}; if(c.includes('@')) body.email=c; else body.telefone=c;
    var r=await fetch(API+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    var d=await r.json(); if(d.erro) throw new Error(d.erro);
    if(!localStorage.getItem('cf_avatar')) localStorage.setItem('cf_avatar', avatares[Math.floor(Math.random()*avatares.length)]);
    localStorage.setItem('cf_token',d.token); localStorage.setItem('cf_cliente',JSON.stringify({nome:d.nome,email:d.email}));
    salvarTel(d.telefone || c);
    toast('Bem-vindo, '+d.nome.split(' ')[0]+'!');
    var redir=getParam('redir'); if(redir){window.location.href=redir;return;}
    mostrarPerfil({nome:d.nome,email:d.email});
  }catch(e){msg.textContent=e.message;msg.className='msg err';}
}

async function registar(){
  var nome=document.getElementById('rNome').value.trim(),email=document.getElementById('rEmail').value.trim();
  var tel=document.getElementById('rTel').value.trim(),pass=document.getElementById('rPass').value;
  var msg=document.getElementById('rMsg');
  if(!nome||!pass){msg.textContent='Preenche nome, telefone e password.';msg.className='msg err';return;}
  if(!validarTel(tel)){msg.textContent='Telefone inválido. Use +244 9XX XXX XXX.';msg.className='msg err';return;}
  if(email && !validarEmail(email)){msg.textContent='Email inválido.';msg.className='msg err';return;}
  if(pass.length<6){msg.textContent='Password: mínimo 6 caracteres.';msg.className='msg err';return;}
  try{
    localStorage.setItem('cf_avatar', avatares[Math.floor(Math.random()*avatares.length)]);
    var r=await fetch(API+'/api/auth/registar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nome:nome,email:email||'',telefone:tel,senha:pass})});
    var d=await r.json(); if(d.erro) throw new Error(d.erro);
    localStorage.setItem('cf_token',d.token); localStorage.setItem('cf_cliente',JSON.stringify({nome:d.nome,email:d.email}));
    salvarTel(tel);
    toast('Conta criada!');
    var redir=getParam('redir'); if(redir){window.location.href=redir;return;}
    mostrarPerfil({nome:d.nome,email:d.email});
  }catch(e){msg.textContent=e.message;msg.className='msg err';}
}

function mostrarPerfil(cli){
  document.getElementById('authBox').style.display='none';
  document.getElementById('perfilBox').style.display='block';

  var avatar = localStorage.getItem('cf_avatar');
  if (!avatar) {
    avatar = avatares[Math.floor(Math.random() * avatares.length)];
    localStorage.setItem('cf_avatar', avatar);
  }

  document.getElementById('perfilCard').innerHTML =
    '<div class="perfil-top">'+
      '<span class="perfil-icone"><i class="'+avatar+'"></i></span>'+
      '<div class="perfil-nome">'+(cli.nome||'Cliente')+'</div>'+
      '<div class="perfil-email">'+(cli.email||'')+'</div>'+
    '</div>'+
    '<div class="perfil-stats">'+
      '<div class="perfil-stat"><span class="perfil-stat-num" id="statEnc">—</span><span class="perfil-stat-lbl">Encomendas</span></div>'+
      '<a href="carrinho.html" class="perfil-stat"><span class="perfil-stat-num" id="statCart">—</span><span class="perfil-stat-lbl">Carrinho</span></a>'+
      '<a href="catalogo.html" class="perfil-stat"><span class="perfil-stat-num" id="statWish">—</span><span class="perfil-stat-lbl">Wishlist</span></a>'+
    '</div>';

  carregarStats();
  carregarEncs();
}

function carregarStats(){
  try{
    var c = JSON.parse(localStorage.getItem('cf_carrinho')||'[]');
    var w = JSON.parse(localStorage.getItem('cf_wl')||'[]');
    document.getElementById('statCart').textContent = c.length||'0';
    document.getElementById('statWish').textContent = w.length||'0';
  }catch(e){}
}

async function carregarEncs(){
  var cont=document.getElementById('encLista');
  try{
    var token = localStorage.getItem('cf_token');
    if(!token){ cont.innerHTML='<p style="font-size:.82rem;color:var(--muted);text-align:center;padding:20px">Sem encomendas.</p>'; return; }
    var r=await fetch(API+'/api/encomendas',{headers:{'Authorization':'Bearer '+token}});
    var encs=await r.json();
    if(!Array.isArray(encs)||!encs.length){
      cont.innerHTML='<div style="text-align:center;padding:20px"><i class="fa-solid fa-box-open" style="font-size:2rem;opacity:.2;display:block;margin-bottom:8px;color:var(--pink)"></i><p style="font-size:.82rem;color:var(--muted)">Ainda não tens encomendas.</p></div>';
      document.getElementById('statEnc').textContent = '0';
      return;
    }
    document.getElementById('statEnc').textContent = encs.length;
    cont.innerHTML = encs.slice(0,5).map(function(e){
      var estados={pendente:'⏳ Pendente',confirmada:'✓ Confirmada',pronta:'📦 Pronta',entregue:'✅ Entregue',cancelada:'✕ Cancelada'};
      return '<div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer" onclick="verEnc(\''+e.ref+'\')">'+
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><span style="font-family:var(--ft);font-size:.85rem">'+e.ref+'</span><span style="font-size:.6rem;color:'+(e.estado==='entregue'?'var(--teal)':'var(--yellow)')+'">'+(estados[e.estado]||e.estado)+'</span></div>'+
        '<div style="display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted)"><span>'+fmtData(e.criado_em)+'</span><span style="font-family:var(--ft);color:var(--pink)">'+kz(e.total)+'</span></div>'+
      '</div>';
    }).join('');
  }catch(e){cont.innerHTML='<p style="font-size:.82rem;color:var(--muted);text-align:center;padding:20px">Erro ao carregar.</p>';}
}

function verEnc(ref){ window.location.href = 'rastrear.html?ref='+ref; }

function logout(){ localStorage.removeItem('cf_token'); localStorage.removeItem('cf_cliente'); localStorage.removeItem('cf_cliente_tel'); localStorage.removeItem('cf_avatar'); location.reload(); }

var cli=getCliente(); if(cli) mostrarPerfil(cli);
</script>
</body>
</html>
