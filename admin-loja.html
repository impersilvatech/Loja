<!DOCTYPE html>
<html lang="pt-AO" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>Gerir Loja</title>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a16;color:#f0f0ff;min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1.5rem;padding:2rem}
.tela{text-align:center;max-width:400px}
.tela i{font-size:3.5rem;margin-bottom:1rem;display:block}
.tela i.carregando{color:#ff6b9d;animation:pulse 2s ease-in-out infinite}
.tela i.sucesso{color:#22c55e}
.tela i.erro{color:#ff4757}
.tela h2{font-size:1.3rem;margin-bottom:.5rem;font-family:'Fredoka One',cursive}
.tela h2.sucesso{color:#22c55e}
.tela h2.erro{color:#ff4757}
.tela p{color:#888;font-size:.9rem;line-height:1.5}
.tela .spin{width:36px;height:36px;border:3px solid #2a2a45;border-top-color:#ff6b9d;border-radius:50%;animation:sp .8s linear infinite;margin:1.2rem auto}
.tela button{margin-top:1.5rem;padding:12px 28px;background:linear-gradient(135deg,#ff6b9d,#b14ae8);color:#fff;border:none;border-radius:50px;font-size:.9rem;font-weight:700;cursor:pointer;font-family:'Fredoka One',cursive}
.tela button.ghost{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);color:#aaa}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.95)}}
</style>
</head>
<body>

<div id="tela" class="tela">
  <i class="fa-solid fa-shield-halved carregando"></i>
  <h2>A verificar acesso...</h2>
  <p>A confirmar a tua identidade</p>
  <div class="spin"></div>
</div>

<script>
var API = 'https://impersilvatech-api.3miliosilva.workers.dev';
var PORTAL_API = 'https://impersilva-ao.3miliosilva.workers.dev';

(function() {
  var token = sessionStorage.getItem('admin_loja_token');
  var lojaId = sessionStorage.getItem('admin_loja_id');

  function mostrarErro(titulo, msg, botao) {
    document.getElementById('tela').innerHTML = 
      '<i class="fa-solid fa-triangle-exclamation erro"></i>' +
      '<h2 class="erro">' + titulo + '</h2>' +
      '<p>' + msg + '</p>' +
      (botao ? botao : '<button onclick="window.location.href=\'verificar-site.html\'">Ir para o Portal</button>');
  }

  if (!token || !lojaId) {
    mostrarErro('Acesso Negado', 'Precisas de fazer login no portal primeiro.');
    return;
  }

  // Verificar token com a API do portal
  fetch(PORTAL_API + '/api/auth/verificar', {
    headers: { 'X-Cliente-Token': token }
  })
  .then(function(r) { return r.ok ? r.json() : null; })
  .then(function(data) {
    if (!data || !data.user) {
      sessionStorage.removeItem('admin_loja_token');
      sessionStorage.removeItem('admin_loja_id');
      mostrarErro('Sessão Expirada', 'A tua sessão expirou. Faz login novamente.');
      return;
    }

    // Token válido! Mostrar sucesso e carregar admin
    document.getElementById('tela').innerHTML = 
      '<i class="fa-solid fa-circle-check sucesso"></i>' +
      '<h2 class="sucesso">Acesso Confirmado!</h2>' +
      '<p>Loja: <strong>' + lojaId + '</strong></p>' +
      '<p style="color:#888;font-size:.8rem;margin-top:.5rem">A carregar painel de gestão...</p>' +
      '<div class="spin"></div>';

    // Guardar token para o admin usar
    localStorage.setItem('adm_tk', token);
    localStorage.setItem('adm_loja_id', lojaId);

    // Carregar o admin da API (servido pelo Worker com verificação)
    // Nota: O Worker precisa ter este endpoint configurado
    fetch(API + '/api/admin/painel?loja=' + lojaId, {
      headers: { 'Authorization': 'Bearer ' + token }
    })
    .then(function(r) {
      if (!r.ok) throw new Error('Erro ao carregar painel');
      return r.text();
    })
    .then(function(html) {
      // Substituir a página inteira pelo admin
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function() {
      // Fallback: redirecionar para admin.html local
      // (assume que o admin.html está na mesma pasta)
      window.location.href = 'admin.html';
    });

  })
  .catch(function() {
    mostrarErro('Erro de Ligação', 'Não foi possível verificar o acesso. Verifica a tua internet.',
      '<button onclick="window.location.reload()">Tentar Novamente</button>');
  });

})();
</script>

</body>
</html>
