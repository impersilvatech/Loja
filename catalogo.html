<!DOCTYPE html>
<html lang="pt-AO" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="theme-color" content="#0d0d1a"/>
<title>Catálogo</title>
<script>
(function(){
  var t=localStorage.getItem('tema')||'dark';
  document.documentElement.setAttribute('data-theme',t);
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  }
})();
</script>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0d0d1a;--bg2:#14142b;--card:#1a1a32;--border:#2a2a4a;--pink:#ff6b9d;--purple:#b14ae8;--teal:#06d6a0;--yellow:#ffd166;--red:#ff4757;--white:#f0f0ff;--muted:#9898bb;--muted2:#4a4a6a;--ft:'Fredoka One',cursive;--fb:'Nunito',sans-serif;--grad:linear-gradient(135deg,#ff6b9d,#b14ae8);--r:14px;--tr:all .3s ease}
[data-theme="light"]{--bg:#fff5f8;--bg2:#fff;--card:#fff;--border:#f0d6e8;--white:#1a0a2e;--muted:#7a5a8a;--muted2:#b0a0b8;--pink:#d4437d;--purple:#7a2fb0;--teal:#048a65;--red:#d63547;--yellow:#a07800}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fb);background:var(--bg);color:var(--white);min-height:100vh;padding-bottom:72px;overflow-x:hidden;transition:background .35s,color .35s}
.hdr{position:sticky;top:0;z-index:100;background:rgba(13,13,26,.97);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:10px 14px;display:flex;align-items:center;gap:10px}
[data-theme="light"] .hdr{background:rgba(255,245,248,.97)}
.hdr-logo{font-family:var(--ft);font-size:1.1rem;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;flex:1}
.hb{width:34px;height:34px;border-radius:50%;background:none;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.88rem;cursor:pointer;color:var(--white);text-decoration:none;transition:var(--tr)}
.hb:hover{border-color:var(--pink);color:var(--pink)}

.srch-bar{padding:10px 12px}
.srch-wrap{display:flex;align-items:center;background:var(--card);border:1.5px solid var(--border);border-radius:50px;padding:0 6px 0 16px;transition:border-color .2s}
.srch-wrap:focus-within{border-color:var(--pink);box-shadow:0 0 0 4px rgba(255,107,157,.08)}
.srch-wrap i{color:var(--muted);font-size:.82rem;flex-shrink:0}
.srch-inp{flex:1;padding:10px 8px;background:none;border:none;font-family:var(--fb);font-size:.85rem;color:var(--white);outline:none}
.srch-inp::placeholder{color:var(--muted2)}
.srch-clear{width:28px;height:28px;border-radius:50%;background:var(--bg2);border:none;color:var(--muted);font-size:.7rem;cursor:pointer;display:none;align-items:center;justify-content:center;flex-shrink:0;transition:var(--tr)}
.srch-clear.show{display:flex}
.srch-clear:active{background:var(--pink);color:#fff}

.cats{overflow-x:auto;scrollbar-width:none;padding:6px 12px 10px}
.cats::-webkit-scrollbar{display:none}
.cats-row{display:flex;gap:6px;width:max-content}
.cpill{padding:6px 14px;border:1.5px solid var(--border);border-radius:50px;background:none;font-family:var(--ft);font-size:.68rem;color:var(--muted);cursor:pointer;white-space:nowrap;transition:var(--tr);display:flex;align-items:center;gap:5px}
.cpill:hover{border-color:var(--pink);color:var(--pink)}
.cpill.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 2px 10px rgba(255,107,157,.3)}

.tbar{display:flex;align-items:center;justify-content:space-between;padding:8px 13px 6px;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--border)}
.tbar-info{font-size:.72rem;color:var(--muted)}
.tbar-info strong{color:var(--white)}
.tbar-acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.wl-btn{display:flex;align-items:center;gap:4px;padding:5px 11px;background:none;border:1px solid var(--border);border-radius:50px;font-family:var(--ft);font-size:.62rem;color:var(--muted);cursor:pointer;transition:var(--tr)}
.wl-btn.on{color:var(--pink);border-color:rgba(255,107,157,.4);background:rgba(255,107,157,.07)}
.vtw{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.vt{width:28px;height:26px;background:none;border:none;font-size:.74rem;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--tr)}
.vt.on{background:var(--pink);color:#fff}
.sort-btn{display:flex;align-items:center;gap:3px;padding:5px 10px;background:none;border:1px solid var(--border);border-radius:50px;font-family:var(--ft);font-size:.6rem;color:var(--muted);cursor:pointer;transition:var(--tr)}
.sort-btn:hover,.sort-btn.on{border-color:var(--pink);color:var(--pink)}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px 12px 0}
.grid.list{display:flex;flex-direction:column;gap:8px}
@media(min-width:520px){.grid:not(.list){grid-template-columns:repeat(3,1fr)}}

.card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .25s,border-color .25s,box-shadow .25s;text-decoration:none;color:inherit;display:block;position:relative;animation:cardIn .4s ease both}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 28px rgba(255,107,157,.18);border-color:rgba(255,107,157,.4)}
@keyframes cardIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.card.out{opacity:.45;cursor:not-allowed;filter:grayscale(.5)}
.grid.list .card{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px}
.cimg{aspect-ratio:1;background:var(--bg2);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:3rem;position:relative}
.grid.list .cimg{width:62px;height:62px;aspect-ratio:auto;flex-shrink:0;border-radius:10px}
.cimg img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.card:hover .cimg img{transform:scale(1.08)}
.ctags{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:4px;pointer-events:none;z-index:2}
.tag{padding:2px 6px!important;border-radius:4px!important;font-family:var(--ft)!important;font-size:.42rem!important;font-weight:700!important;text-transform:uppercase!important;letter-spacing:.2px!important;line-height:1.3!important;display:inline-block!important}
.tag-promo{background:var(--red)!important;color:#fff!important}
.tag-dest{background:var(--grad)!important;color:#fff!important}
.tag-novo{background:var(--teal)!important;color:#0d0d1a!important}
.tag-x{visibility:hidden!important}
.wbtn{width:24px;height:24px;border-radius:6px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:.62rem;cursor:pointer;pointer-events:all;transition:var(--tr);color:#fff}
.wbtn:hover{background:rgba(255,107,157,.3);border-color:var(--pink)}
.wbtn.on{background:rgba(255,107,157,.3);border-color:var(--pink);color:var(--pink)}
.esgo{position:absolute;bottom:0;left:0;right:0;background:rgba(255,71,87,.12);border-top:1px solid rgba(255,71,87,.2);text-align:center;font-family:var(--ft);font-size:.42rem;text-transform:uppercase;color:var(--red);padding:2px}
.cbody{padding:7px 9px 9px}
.grid.list .cbody{padding:0;flex:1;min-width:0}
.ccat{font-size:.44rem;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--pink);margin-bottom:1px}
.cnom{font-family:var(--ft);font-size:.82rem;line-height:1.2;margin-bottom:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.grid.list .cnom{-webkit-line-clamp:1;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cpreco{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.preco{font-family:var(--ft);font-size:.85rem;color:var(--pink)}
.preco-orig{font-size:.6rem;text-decoration:line-through;color:var(--muted2)}
.badd{position:absolute;bottom:5px;right:5px;width:28px;height:28px;border-radius:50%;background:var(--grad);border:none;color:#fff;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(255,107,157,.4);transition:var(--tr);z-index:3}
.badd:active{transform:scale(.9)}

.nav{position:fixed;bottom:0;left:0;right:0;z-index:200;padding:6px 10px 8px;display:flex;gap:8px;align-items:center;background:rgba(13,13,26,.97);border-top:1px solid var(--border)}
[data-theme="light"] .nav{background:rgba(255,245,248,.97)}
.btn-home-nav{width:38px;height:38px;background:var(--bg2);border:1px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--white);text-decoration:none;font-size:.9rem;flex-shrink:0}
.nav-links{display:flex;gap:4px;align-items:center}
.nl{display:flex;flex-direction:column;align-items:center;gap:1px;padding:0 10px;color:var(--muted);font-size:.5rem;text-decoration:none;transition:var(--tr)}
.nl i{font-size:1.05rem}.nl:hover{color:var(--pink)}
.btn-cart-nav{flex:1;height:38px;background:var(--grad);border:none;border-radius:50px;font-family:var(--ft);font-size:.76rem;color:#fff;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px}
.cart-ct{background:rgba(255,255,255,.22);border-radius:50px;padding:1px 8px;font-size:.66rem}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:300;opacity:0;pointer-events:none;transition:opacity .25s}
.ov.on{opacity:1;pointer-events:all}
.drawer{position:fixed;bottom:0;left:0;right:0;z-index:301;background:var(--card);border-radius:22px 22px 0 0;border-top:1px solid rgba(255,107,157,.25);max-height:85vh;overflow-y:auto;scrollbar-width:none;transform:translateY(100%);transition:transform .32s cubic-bezier(.34,1.1,.64,1)}
.drawer.on{transform:translateY(0)}
.drawer::-webkit-scrollbar{display:none}
.dr-pull{width:36px;height:3px;background:var(--border);border-radius:2px;margin:10px auto 0}
.dr-hd{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 0}
.dr-hd-t{font-family:var(--ft);font-size:.8rem;color:var(--muted)}
.dr-cls{background:none;border:1px solid var(--border);border-radius:8px;padding:4px 11px;font-family:var(--ft);font-size:.65rem;color:var(--muted);cursor:pointer}
.dr-body{padding:12px 16px 20px}
.dr-prod{display:flex;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:12px}
.dr-img{width:80px;height:80px;flex-shrink:0;border-radius:14px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:2.5rem;overflow:hidden}
.dr-img img{width:100%;height:100%;object-fit:cover}
.dr-info{flex:1;min-width:0}
.dr-cat{font-size:.5rem;font-weight:700;text-transform:uppercase;color:var(--pink);margin-bottom:2px}
.dr-nom{font-family:var(--ft);font-size:1rem;line-height:1.2;margin-bottom:4px}
.dr-preco{font-family:var(--ft);font-size:1.1rem;color:var(--pink)}
.dr-preco-orig{font-size:.75rem;text-decoration:line-through;color:var(--muted2);margin-left:6px}
.dr-qty{display:flex;align-items:center;gap:8px;margin-top:12px}
.dr-qty button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--border);background:none;color:var(--white);font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--tr)}
.dr-qty button:active{background:var(--pink);border-color:var(--pink);color:#fff}
.dr-qty span{min-width:36px;text-align:center;font-family:var(--ft);font-size:1.1rem}
.dr-acts{display:flex;gap:8px;margin-top:14px}
.dr-acts button,.dr-acts a{flex:1;padding:12px;border-radius:50px;font-family:var(--ft);font-size:.78rem;cursor:pointer;text-align:center;text-decoration:none;transition:var(--tr);display:flex;align-items:center;justify-content:center;gap:6px}
.dr-btn-add{background:var(--grad);border:none;color:#fff;box-shadow:0 4px 14px rgba(255,107,157,.3)}
.dr-btn-add:active{transform:scale(.97)}
.dr-btn-detalhes{background:none;border:1.5px solid var(--border);color:var(--muted)}
.dr-btn-detalhes:hover{border-color:var(--pink);color:var(--pink)}
.dr-nota{width:100%;margin-top:10px;padding:10px 12px;background:var(--bg2);border:1.5px solid var(--border);border-radius:12px;font-family:var(--fb);font-size:.8rem;color:var(--white);resize:none;outline:none}
.dr-nota:focus{border-color:var(--pink)}.dr-nota::placeholder{color:var(--muted2)}

.empty{text-align:center;padding:60px 20px}
.empty i{font-size:3.5rem;opacity:.14;display:block;margin-bottom:14px;color:var(--pink)}
.empty p{font-family:var(--ft);font-size:.92rem;color:var(--muted);margin-bottom:16px}
.empty button{padding:10px 24px;background:var(--grad);border:none;border-radius:50px;font-family:var(--ft);font-size:.78rem;color:#fff;cursor:pointer}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--card);border:1px solid var(--pink);border-radius:14px;padding:10px 18px;font-size:.82rem;font-weight:700;color:var(--pink);z-index:9999;opacity:0;pointer-events:none;transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.err{border-color:var(--red);color:var(--red)}
.spin{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--pink);border-radius:50%;animation:spin-anim .8s linear infinite;margin:28px auto}
@keyframes spin-anim{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-logo" id="hdrLogo">Catálogo</div>
  <button class="hb" onclick="toggleTheme()"><i class="fa-solid fa-sun" id="temaIco"></i></button>
  <button class="hb" onclick="partilharLoja()"><i class="fa-solid fa-share-nodes"></i></button>
  <a href="carrinho.html" class="hb"><i class="fa-solid fa-cart-shopping"></i></a>
</header>

<div class="srch-bar">
  <div class="srch-wrap">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input class="srch-inp" type="text" id="sInp" placeholder="Pesquisar produto..." oninput="onSrch()" autocomplete="off"/>
    <button class="srch-clear" id="sClear" onclick="limparBusca()"><i class="fa-solid fa-xmark"></i></button>
  </div>
</div>

<div class="cats"><div class="cats-row" id="catsRow"></div></div>

<div class="tbar">
  <span class="tbar-info" id="info">A carregar...</span>
  <div class="tbar-acts">
    <button class="sort-btn" id="sortBtn" onclick="toggleSort()"><i class="fa-solid fa-arrow-down-wide-short"></i> Ordenar</button>
    <button class="wl-btn" id="wlBtn" onclick="toggleWlModo()"><i class="fa-solid fa-heart"></i> Wishlist <span id="wlN" style="display:none;background:var(--pink);color:#fff;border-radius:50px;padding:0 6px;font-size:.54rem">0</span></button>
    <div class="vtw">
      <button class="vt on" id="vtG" onclick="setVista('grid')"><i class="fa-solid fa-grip"></i></button>
      <button class="vt" id="vtL" onclick="setVista('list')"><i class="fa-solid fa-list"></i></button>
    </div>
  </div>
</div>

<div class="grid" id="grid"><div class="spin"></div></div>
<div class="empty" id="emptyEl" style="display:none"><i class="fa-solid fa-box-open"></i><p id="emptyMsg">Sem produtos disponíveis.</p><button onclick="limparTudo()"><i class="fa-solid fa-rotate-left"></i> Ver todos</button></div>

<div class="ov" id="ov" onclick="fecharDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="dr-pull"></div>
  <div class="dr-hd"><span class="dr-hd-t">Adicionar ao Carrinho</span><button class="dr-cls" onclick="fecharDrawer()"><i class="fa-solid fa-xmark"></i> Fechar</button></div>
  <div class="dr-body" id="drBody"></div>
</div>

<div class="nav">
  <a href="index.html" class="btn-home-nav"><i class="fa-solid fa-house"></i></a>
  <div class="nav-links">
    <a href="catalogo.html" class="nl" style="color:var(--pink)"><i class="fa-solid fa-store"></i><span>Catálogo</span></a>
    <a href="conta.html" class="nl"><i class="fa-solid fa-user"></i><span>Conta</span></a>
    <a href="sobre.html" class="nl"><i class="fa-solid fa-circle-info"></i><span>Sobre</span></a>
  </div>
  <a href="carrinho.html" class="btn-cart-nav" id="nCart"><i class="fa-solid fa-cart-shopping"></i> Carrinho <span class="cart-ct" id="nCartN" style="display:none">0</span></a>
</div>
<div class="toast" id="toast"></div>

<script>
var API='https://impersilva-d1work.3miliosilva.workers.dev';
var loja={},cats=[],prods=[],catAtiva='',wlModo=false,vista='grid',sortModo='padrao';
var drProd=null,drQty=1;

function toggleTheme(){var t=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',t);localStorage.setItem('tema',t);document.getElementById('temaIco').className=t==='dark'?'fa-solid fa-sun':'fa-solid fa-moon';}
function getCarrinho(){try{return JSON.parse(localStorage.getItem('cf_carrinho')||'[]');}catch(e){return[];}}
function salvarCarrinho(c){localStorage.setItem('cf_carrinho',JSON.stringify(c));}
function qtdCarrinho(){return getCarrinho().reduce(function(s,i){return s+(i.quantidade||1);},0);}
function getWishlist(){try{return JSON.parse(localStorage.getItem('cf_wl')||'[]');}catch(e){return[];}}
function kz(v){if(v==null)return'—';return'Kz '+Number(v).toLocaleString('pt');}
function toast(msg,t){var el=document.getElementById('toast');el.textContent=msg;el.className='toast show '+(t||'ok');setTimeout(function(){el.classList.remove('show');},3000);}
function partilharLoja(){if(navigator.share)navigator.share({title:loja.nome||'Catálogo',url:window.location.href});else{navigator.clipboard.writeText(window.location.href);toast('Link copiado!');}}

document.addEventListener('DOMContentLoaded',async function(){
  await carregarDados();
  var iniCat=sessionStorage.getItem('cf_cat_ini');if(iniCat){catAtiva=iniCat;sessionStorage.removeItem('cf_cat_ini');}
  var urlCat=new URLSearchParams(location.search).get('cat');if(urlCat)catAtiva=urlCat;
  construirCats();renderizar();atualizarBadges();
});

async function carregarDados(){
  try{var rL=await fetch(API+'/api/loja');loja=await rL.json();if(loja.erro)loja={};}catch(e){loja={};}
  try{var rC=await fetch(API+'/api/categorias');cats=await rC.json();if(!Array.isArray(cats))cats=[];}catch(e){cats=[];}
  try{var rP=await fetch(API+'/api/produtos');prods=await rP.json();if(!Array.isArray(prods))prods=[];}catch(e){prods=[];}
  if(loja.nome){document.getElementById('hdrLogo').textContent=loja.nome;document.title='Catálogo — '+loja.nome;}
  if(loja.cor_primaria)document.documentElement.style.setProperty('--pink',loja.cor_primaria);
  if(loja.cor_secundaria)document.documentElement.style.setProperty('--purple',loja.cor_secundaria);
}

function onSrch(){var q=document.getElementById('sInp').value;document.getElementById('sClear').classList.toggle('show',!!q);wlModo=false;document.getElementById('wlBtn').classList.remove('on');renderizar(q);}
function limparBusca(){document.getElementById('sInp').value='';document.getElementById('sClear').classList.remove('show');renderizar();}

function construirCats(){var row=document.getElementById('catsRow');row.innerHTML='';var btnAll=criarPill('Tudo','');if(!catAtiva)btnAll.classList.add('on');row.appendChild(btnAll);cats.forEach(function(c){var btn=criarPill(c.nome,c.slug);if(catAtiva===c.slug)btn.classList.add('on');row.appendChild(btn);});}
function criarPill(nome,slug){var b=document.createElement('button');b.className='cpill';b.dataset.slug=slug;b.innerHTML='<i class="fa-solid fa-tag"></i> '+nome;b.addEventListener('click',function(){catAtiva=slug;wlModo=false;document.getElementById('wlBtn').classList.remove('on');document.querySelectorAll('.cpill').forEach(function(x){x.classList.remove('on');});b.classList.add('on');renderizar();});return b;}
function limparTudo(){catAtiva='';wlModo=false;document.getElementById('wlBtn').classList.remove('on');document.querySelectorAll('.cpill').forEach(function(x){x.classList.remove('on');});limparBusca();renderizar();}
function setVista(v){vista=v;document.getElementById('grid').className='grid'+(v==='list'?' list':'');document.getElementById('vtG').classList.toggle('on',v==='grid');document.getElementById('vtL').classList.toggle('on',v==='list');}
function toggleWlModo(){wlModo=!wlModo;document.getElementById('wlBtn').classList.toggle('on',wlModo);renderizar();}

var sortLabel={padrao:'Padrão',preco_asc:'Menor Preço',preco_desc:'Maior Preço',nome_asc:'Nome A-Z',nome_desc:'Nome Z-A',recente:'Mais Recente'};
var sortIdx=0,sortKeys=Object.keys(sortLabel);
function toggleSort(){sortIdx=(sortIdx+1)%sortKeys.length;sortModo=sortKeys[sortIdx];document.getElementById('sortBtn').innerHTML='<i class="fa-solid fa-arrow-down-wide-short"></i> '+sortLabel[sortModo];document.getElementById('sortBtn').classList.toggle('on',sortModo!=='padrao');renderizar();}
function ordenar(lista){
  if(sortModo==='preco_asc')return lista.sort(function(a,b){return(a.preco_base||0)-(b.preco_base||0);});
  if(sortModo==='preco_desc')return lista.sort(function(a,b){return(b.preco_base||0)-(a.preco_base||0);});
  if(sortModo==='nome_asc')return lista.sort(function(a,b){return a.nome.localeCompare(b.nome);});
  if(sortModo==='nome_desc')return lista.sort(function(a,b){return b.nome.localeCompare(a.nome);});
  if(sortModo==='recente')return lista.sort(function(a,b){return new Date(b.criado_em||0)-new Date(a.criado_em||0);});
  return lista;
}

function renderizar(termo){
  var grid=document.getElementById('grid'),emptyEl=document.getElementById('emptyEl');
  var wl=getWishlist(),q=termo||document.getElementById('sInp').value.trim().toLowerCase();
  var lista=prods.slice();
  if(wlModo){lista=lista.filter(function(p){return wl.includes(String(p.id));});}
  else{if(catAtiva){var catObj=cats.find(function(c){return c.slug===catAtiva;});if(catObj)lista=lista.filter(function(p){return p.categoria_id===catObj.id;});}if(q){lista=lista.filter(function(p){return p.nome.toLowerCase().includes(q)||(p.descricao||'').toLowerCase().includes(q);});}}
  lista=ordenar(lista);
  document.getElementById('info').innerHTML='<strong>'+lista.length+'</strong> produto'+(lista.length!==1?'s':'');
  var wlN=document.getElementById('wlN');wlN.textContent=wl.length;wlN.style.display=wl.length>0?'inline':'none';
  if(!lista.length){grid.innerHTML='';emptyEl.style.display='block';if(q)document.getElementById('emptyMsg').textContent='Sem resultados para "'+q+'".';else if(wlModo)document.getElementById('emptyMsg').textContent='A tua wishlist está vazia.';else document.getElementById('emptyMsg').textContent='Sem produtos nesta categoria.';return;}
  emptyEl.style.display='none';
  var sym=loja.simbolo_moeda||'Kz',agora=Date.now(),cart=getCarrinho();
  grid.innerHTML=lista.map(function(p,i){
    var cat=cats.find(function(c){return c.id===p.categoria_id;});
    var wished=wl.includes(String(p.id));
    var pct=(p.preco_original&&p.preco_original>p.preco_base)?Math.round((1-p.preco_base/p.preco_original)*100):0;
    var isNew=p.criado_em&&(agora-new Date(p.criado_em).getTime())<7*24*60*60*1000;
    var out=p.disponivel===0;
    var imgH=p.imagem_url?'<img src="'+p.imagem_url+'" alt="" loading="lazy" onerror="this.innerHTML=\'<i class=fa-solid fa-image style=font-size:2rem;color:var(--muted)></i>\'">':'<i class="fa-solid fa-image" style="font-size:2rem;color:var(--muted)"></i>';
    var tagClass=pct>0?'tag-promo':p.destaque?'tag-dest':isNew?'tag-novo':'tag-x';
    var tagTxt=pct>0?'-'+pct+'%':p.destaque?'Destaque':isNew?'Novo':'';
    return '<a href="produto.html?id='+p.id+'" class="card'+(out?' out':'')+'" style="animation-delay:'+(i*0.03)+'s">'+
      '<div class="cimg">'+imgH+
        '<div class="ctags"><span class="tag '+tagClass+'">'+tagTxt+'</span>'+
          '<button class="wbtn'+(wished?' on':'')+'" onclick="event.preventDefault();event.stopPropagation();wlToggle(this,'+p.id+')">'+(wished?'<i class="fa-solid fa-heart"></i>':'<i class="fa-regular fa-heart"></i>')+'</button>'+
        '</div>'+(out?'<div class="esgo">Esgotado</div>':'')+
      '</div>'+
      '<div class="cbody"><div class="ccat">'+(cat?cat.nome:'')+'</div><div class="cnom">'+p.nome+'</div>'+
        '<div class="cpreco"><span class="preco">'+kz(p.preco_base)+'</span>'+(pct>0?'<span class="preco-orig">'+kz(p.preco_original)+'</span>':'')+'</div>'+
      '</div>'+
      (!out&&p.preco_base>0?'<button class="badd" onclick="event.preventDefault();event.stopPropagation();abrirDrawer('+p.id+')"><i class="fa-solid fa-plus"></i></button>':'')+
    '</a>';
  }).join('');
}

function abrirDrawer(id){
  drProd=prods.find(function(x){return x.id===id;});if(!drProd)return;
  drQty=1;
  var p=drProd,pct=(p.preco_original&&p.preco_original>p.preco_base)?Math.round((1-p.preco_base/p.preco_original)*100):0;
  var imgH=p.imagem_url?'<img src="'+p.imagem_url+'" alt="" onerror="this.innerHTML=\'<i class=fa-solid fa-image></i>\'">':'<i class="fa-solid fa-image" style="font-size:2rem;color:var(--muted)"></i>';
  var cat=cats.find(function(c){return c.id===p.categoria_id;});
  document.getElementById('drBody').innerHTML=
    '<div class="dr-prod"><div class="dr-img">'+imgH+'</div><div class="dr-info"><div class="dr-cat">'+(cat?cat.nome:'')+'</div><div class="dr-nom">'+p.nome+'</div><div class="dr-preco">'+kz(p.preco_base)+(pct>0?'<span class="dr-preco-orig">'+kz(p.preco_original)+'</span>':'')+'</div></div></div>'+
    '<div class="dr-qty"><button onclick="drAltQty(-1)"><i class="fa-solid fa-minus"></i></button><span id="drQtyVal">1</span><button onclick="drAltQty(1)"><i class="fa-solid fa-plus"></i></button></div>'+
    '<textarea class="dr-nota" id="drNota" placeholder="Personalização, observações..."></textarea>'+
    '<div class="dr-acts"><a href="produto.html?id='+p.id+'" class="dr-btn-detalhes"><i class="fa-solid fa-circle-info"></i> Ver Detalhes</a><button class="dr-btn-add" onclick="drAddCart()"><i class="fa-solid fa-cart-shopping"></i> Adicionar — <span id="drPrecoTotal">'+kz(p.preco_base)+'</span></button></div>';
  document.getElementById('ov').classList.add('on');document.getElementById('drawer').classList.add('on');document.body.style.overflow='hidden';
}
function fecharDrawer(){document.getElementById('ov').classList.remove('on');document.getElementById('drawer').classList.remove('on');document.body.style.overflow='';drProd=null;}
function drAltQty(d){drQty=Math.max(1,Math.min(99,drQty+d));document.getElementById('drQtyVal').textContent=drQty;document.getElementById('drPrecoTotal').textContent=kz((drProd.preco_base||0)*drQty);}
function drAddCart(){if(!drProd)return;var nota=document.getElementById('drNota').value.trim();var c=getCarrinho();c.push({chave:''+drProd.id+'-'+Date.now(),produto_id:drProd.id,nome:drProd.nome,preco:drProd.preco_base,quantidade:drQty,imagem:drProd.imagem_url||'',nota:nota});salvarCarrinho(c);atualizarBadges();renderizar();fecharDrawer();toast(drProd.nome+' adicionado!');}
function wlToggle(btn,id){var wl=getWishlist(),added=!wl.includes(String(id));if(added){wl.push(String(id));btn.classList.add('on');btn.innerHTML='<i class="fa-solid fa-heart"></i>';}else{wl=wl.filter(function(x){return x!==String(id);});btn.classList.remove('on');btn.innerHTML='<i class="fa-regular fa-heart"></i>';}localStorage.setItem('cf_wl',JSON.stringify(wl));var wlN=document.getElementById('wlN');wlN.textContent=wl.length;wlN.style.display=wl.length>0?'inline':'none';toast(added?'Adicionado à wishlist!':'Removido da wishlist');}
function atualizarBadges(){var q=qtdCarrinho(),nN=document.getElementById('nCartN');if(nN){nN.textContent=q;nN.style.display=q>0?'inline':'none';}}
</script>
</body>
